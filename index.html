<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Video</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}


/* =========================
   BACKGROUND
========================= */

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255, 0, 70, .10),
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 30%,
            rgba(0, 100, 255, .10),
            transparent 35%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(130, 0, 255, .08),
            transparent 40%
        ),

        #030303;

    color: white;

    font-family: Arial, sans-serif;

}


/* =========================
   LAYAR AWAL
========================= */

#awal {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #030303;

    z-index: 9999;

}


/* =========================
   PLAY
========================= */

#playBtn {

    width: 190px;

    padding: 18px 0;

    border-radius: 50px;

    border: 1px solid rgba(255,255,255,.35);

    background:
        linear-gradient(
            135deg,
            rgba(255,40,80,.18),
            rgba(40,100,255,.18)
        );

    color: white;

    font-size: 18px;

    font-weight: bold;

    letter-spacing: 2px;

    cursor: pointer;

    backdrop-filter: blur(10px);

    box-shadow:
        0 0 20px rgba(255,40,80,.20),
        0 0 30px rgba(40,100,255,.15);

    transition: .3s;

}

#playBtn:active {
    transform: scale(.94);
}


/* =========================
   VIDEO
========================= */

#content {

    display: none;

    width: 100%;

    height: 100vh;

    justify-content: center;

    align-items: center;

}


.video-box {

    width: 92%;

    max-width: 900px;

    max-height: 88vh;

    padding: 2px;

    border-radius: 20px;

    background:
        linear-gradient(
            120deg,
            #ff304f,
            #7a42ff,
            #168cff,
            #ff304f
        );

    background-size: 300% 300%;

    animation:
        rgbBorder 7s ease infinite;

    box-shadow:
        0 0 25px rgba(255,40,80,.18),
        0 0 45px rgba(60,80,255,.12);

}


@keyframes rgbBorder {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


video {

    display: block;

    width: 100%;

    max-height: 84vh;

    object-fit: contain;

    border-radius: 18px;

    background: #000;

    /* Tidak bisa diklik untuk pause */

    pointer-events: none;

}


/* =========================
   LOADING
========================= */

#redirectScreen {

    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;

    align-items: center;

    background: #030303;

    z-index: 99999;

}


.loader {

    width: 35px;

    height: 35px;

    border-radius: 50%;

    border: 3px solid rgba(255,255,255,.15);

    border-top-color: #ff304f;

    border-right-color: #238cff;

    animation:
        spin .7s linear infinite;

}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


</style>

</head>


<body>


<!-- =========================
     PLAY SCREEN
========================= -->

<div id="awal">

    <button id="playBtn">
        ▶ PLAY
    </button>

</div>


<!-- =========================
     VIDEO
========================= -->

<div id="content">

    <div class="video-box">

        <video
            id="video"
            playsinline
            preload="auto"
            disablePictureInPicture
            controlslist="
                nodownload
                noplaybackrate
                nofullscreen">

            <source
                src="video.mp4"
                type="video/mp4">

            Browser tidak mendukung video.

        </video>

    </div>

</div>


<!-- =========================
     LOADING REDIRECT
========================= -->

<div id="redirectScreen">

    <div class="loader"></div>

</div>


<script>


/* =================================================
   LINK TIKTOK
================================================= */

const TIKTOK_URL =
    "https://vt.tiktok.com/ZSbHUKDvP/";


/* =========================
   ELEMENT
========================= */

const awal =
    document.getElementById("awal");

const content =
    document.getElementById("content");

const playBtn =
    document.getElementById("playBtn");

const video =
    document.getElementById("video");

const redirectScreen =
    document.getElementById("redirectScreen");


/* =========================
   STATUS
========================= */

let videoFinished = false;

let alreadyRedirected = false;

let volumeLock = true;


/* =================================================
   PLAY VIDEO
================================================= */

playBtn.addEventListener(
    "click",
    async function() {

        awal.style.display = "none";

        content.style.display = "flex";

        videoFinished = false;

        alreadyRedirected = false;

        volumeLock = true;


        /* Volume maksimum */

        video.volume = 1;

        video.muted = false;


        try {

            await video.play();

        }

        catch(error) {

            console.log(
                "Video tidak dapat diputar:",
                error
            );

        }

    }
);


/* =================================================
   VOLUME TERKUNCI 100%
================================================= */

video.addEventListener(
    "volumechange",
    function() {

        if (volumeLock) {

            video.volume = 1;

            video.muted = false;

        }

    }
);


/* =================================================
   JIKA VIDEO PAUSE
================================================= */

video.addEventListener(
    "pause",
    function() {

        if (!videoFinished) {

            video.play().catch(
                () => {}
            );

        }

    }
);


/* =================================================
   VIDEO PLAY
================================================= */

video.addEventListener(
    "play",
    function() {

        volumeLock = true;

        video.volume = 1;

        video.muted = false;

    }
);


/* =================================================
   BLOK SPACE / K
================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            (
                event.code === "Space" ||
                event.key.toLowerCase() === "k"
            )
            &&
            !videoFinished
        ) {

            event.preventDefault();

            if (video.paused) {

                video.play().catch(
                    () => {}
                );

            }

        }

    }
);


/* =================================================
   VIDEO SELESAI
================================================= */

video.addEventListener(
    "ended",
    function() {

        /* Cegah redirect dua kali */

        if (alreadyRedirected) {
            return;
        }

        alreadyRedirected = true;

        videoFinished = true;

        volumeLock = false;


        /* Sembunyikan video */

        content.style.display =
            "none";


        /* Tampilkan loading */

        redirectScreen.style.display =
            "flex";


        /*
           Beri sedikit waktu untuk
           menampilkan loading.
        */

        setTimeout(
            function() {

                /*
                   Buat link sementara.
                   Browser menangani short-link
                   TikTok secara normal.
                */

                const link =
                    document.createElement("a");

                link.href =
                    TIKTOK_URL;

                link.target =
                    "_self";

                link.rel =
                    "noopener";

                document.body.appendChild(link);

                link.click();

                link.remove();

            },
            500
        );

    }
);

</script>

</body>

</html>
